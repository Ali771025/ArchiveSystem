x-worker-env: &worker-env
  ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ArchivePortfolio;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env};TrustServerCertificate=True
  Storage__Provider: MinIO
  MinIO__Endpoint: http://minio:9000
  MinIO__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  MinIO__BucketName: archive-portfolio
  MinIO__UseSSL: "false"
  MinIO__ForcePathStyle: "true"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  OpenSearch__Uri: http://opensearch:9200

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/archive-portfolio

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["search-data:/usr/share/opensearch/data"]
    ulimits:
      memlock: {soft: -1, hard: -1}

  api:
    build:
      context: .
      dockerfile: src/ArchiveSystem.Presentation.Api/Dockerfile
    environment:
      <<: *worker-env
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: archive-portfolio
      Jwt__Audience: archive-portfolio
      Migration__ApplyOnStartup: "true"
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
    depends_on:
      sqlserver: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_started}
    ports: ["127.0.0.1:5194:8080"]

  frontend:
    build:
      context: .
      dockerfile: src/ArchiveSystem.Frontend/Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]

  worker-thumbnail:
    profiles: [processing]
    build:
      context: .
      dockerfile: src/ArchiveSystem.Worker.Thumbnail/Dockerfile
    environment: *worker-env
    depends_on: [api]

  worker-indexer:
    profiles: [processing]
    build:
      context: .
      dockerfile: src/ArchiveSystem.Worker.Indexer/Dockerfile
    environment: *worker-env
    depends_on: [api, opensearch]

volumes:
  sql-data:
  rabbitmq-data:
  minio-data:
  search-data:
